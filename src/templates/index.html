<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Считывание маркировки</title>
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: light dark; --gap: 16px; --accent: #1a6fd1; --bad: #c0392b; --warn: #b9770e; }
  body { font-family: system-ui, sans-serif; margin: 0; padding: var(--gap); max-width: 960px; margin-inline: auto; }
  h1 { font-size: 1.4rem; }
  .row { display: flex; gap: var(--gap); flex-wrap: wrap; margin-bottom: var(--gap); align-items: center; }
  button, .file-button { font-size: 1rem; padding: 10px 18px; border-radius: 8px; border: 1px solid var(--accent);
    background: var(--accent); color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: progress; }
  .file-button input { display: none; }
  #preview { max-width: 100%; max-height: 420px; border: 1px solid #8884; border-radius: 8px; display: none; }
  textarea { width: 100%; min-height: 140px; font: 1.2rem/1.4 ui-monospace, monospace; padding: 10px; box-sizing: border-box; }
  #message { min-height: 1.4em; font-weight: 600; }
  #message.error, #message.not_recognized { color: var(--bad); }
  #message.partial { color: var(--warn); }
  #meta { color: #888; font-size: .9rem; }
</style>
</head>
<body>
<h1>Считывание маркировки металлических листов</h1>

<div class="row">
  <label class="file-button">Выбрать изображение
    <input type="file" id="file" accept=".jpg,.jpeg,.png,image/jpeg,image/png">
  </label>
  <button id="run" disabled>Распознать</button>
  <span id="meta"></span>
</div>

<div class="row"><img id="preview" alt="Предварительный просмотр"></div>

<div id="message" role="status"></div>
<label for="result">Результат (можно исправить вручную):</label>
<textarea id="result" placeholder="Здесь появится распознанный текст маркировки"></textarea>

<script>
  const fileInput = document.getElementById('file');
  const runButton = document.getElementById('run');
  const preview = document.getElementById('preview');
  const message = document.getElementById('message');
  const result = document.getElementById('result');
  const meta = document.getElementById('meta');

  function show(text, kind) { message.textContent = text; message.className = kind || ''; }

  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    result.value = ''; meta.textContent = ''; show('');
    if (!file) { runButton.disabled = true; preview.style.display = 'none'; return; }
    preview.src = URL.createObjectURL(file);
    preview.style.display = 'block';
    runButton.disabled = false;
  });

  runButton.addEventListener('click', async () => {
    const file = fileInput.files[0];
    if (!file) { show('Файл не выбран.', 'error'); return; }
    const form = new FormData();
    form.append('image', file);
    runButton.disabled = true;
    show('Идёт распознавание, это может занять до минуты…');
    try {
      const response = await fetch('/recognize', { method: 'POST', body: form });
      const data = await response.json();
      if (!response.ok) { show(data.error, 'error'); return; }
      result.value = data.text;
      show(data.message, data.status);
      meta.textContent = `Угол: ${data.angle}°, время: ${data.elapsed_seconds} с`;
      if (data.status === 'not_recognized') { result.placeholder = 'Введите маркировку вручную'; }
      result.focus();
    } catch (error) {
      show('Не удалось связаться с сервером.', 'error');
    } finally {
      runButton.disabled = false;
    }
  });
</script>
</body>
</html>
